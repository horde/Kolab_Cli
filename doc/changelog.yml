  notes: "chore: refresh qc fixes and platform deps\nchore: Update workflow dependency\nrefactor: Use PSR-4 horde/yaml\nUpdate metadata and workflows for PHP 8 support\nAdd CI job for satis repo update\nAdd warning against using this master branch for patches\nRegenerate composer.json\nUpdate supported PHP versions and configuration names.\nAdd chomp character.\nEnable PHP 7.3 CI.\nUpdate package definitions.\nFix getting exit code on PHP 7.2+.\nCreate CHANGES for all components.\nBuild changelog.yml from existing changelog(s).\nUpdate .horde.yml with extended information.\nUpdate composer.json.\nEnable 7.2 builds.\nPEAR on 5.6 and 7.0 is fixed.\nUpdate file list\nMove phpunit configuration to base directory.\nIndicate markup language.\nUpdate references to COPYING files.\nUse LICENSE consistently and move to base directory.\nStop flooding #horde channel.\nUse https URLs.\nRemove incorrect links.\nInstall all dependencies but PECL extensions.\nHopefully this finally fixes Travis builds now.\nAlways discover channel manually, due to Travis bug.\nFix Travis tests.\nAdd Travis configuration and .gitignore files.\nAdd type parameter to .horde.yml files.\nUpdate composer information.\nUpdated composer definitions.\nRename horde.yml files.\nStandardize library full names.\nGenerate horde.yml files for all components.\nHappy New Year!\nUse HTTPS.\nAdd or remove replacement tasks where necessary.\nNow that all tests pass on PHP 7, bump supported PHP version at least for all packages that have tests.\nHappy New Year!\nUpdated\nCS: Lowercase php keywords (especially instanceof / implements / extends)\nUpdated\nBFN\nphpdoc\nUse Horde_String's locale-independent methods.\nHappy New Year!\nRequiring Horde_Translation for packages missing them Composer or PEAR.\nAuto detecting locale directory, removing lots overloading of methods that aren't needed anymore.\nUse 'static' keyword in the correct order as per PSR-2.\nExclude BC breaking PHP versions.\nHappy New Year!\nAdd composer.json to packages/libraries\nUpdate es translation.\nUpdate pt_BR translation.\nUpdate eu translation.\nFix getFolder() call.\nHappy New Year!\nUpdate eu translation.\nAdd/update Horde_Test dependencies.\nSetup tests without requiring any modification of Horde_Test glue files.\nUpdate ja translation.\nStable versions.\nUpdate ja translation.\nBump minimum versions to beta1.\nClean up the rest of the dependencies for Horde 5\nUpdate dep versions for Browser, Cache, Cli, Cli_Modular, Compress, Controller\nUpdate dep versions for Horde_Autoloader\nExclude pre-releases of higher major versions too.\nFix next version.\nDevelopment mode for Horde_Kolab_Cli-2.0.0beta1"
